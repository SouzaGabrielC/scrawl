[package]
name = "scrawl"
version = "0.3.3"
edition = "2024"
default-run = "scrawl"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
dirs = "7.0.0"
flume = "0.12.0"
gpui = "0.2.2"
hound = "3.5.1"
libc = "0.2.189"
ndarray = "0.16"
ort = "2.0.0-rc.9"
png = "0.18.1"
rustfft = "6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "2.12"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10.0"
core-graphics = "0.24.0"
core-graphics-types = "0.1.3"
core-text = "21.0.0"
core-video = "0.4.3"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-core-foundation = "0.3.2"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSData", "NSString"] }
objc2-quartz-core = { version = "0.3.2", features = ["CALayer"] }
metal = "0.29.0"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }

[target.'cfg(target_os = "linux")'.dependencies]
ab_glyph = "0.2.29"
arboard = "3.4"
bytemuck = { version = "1.21", features = ["derive"] }
fontdb = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
muda = "0.15"
raw-window-handle = "0.6"
tiny-skia = "0.11.4"
tray-icon = "0.19"
wgpu = "24.0"
x11rb = { version = "0.13.1", features = ["randr", "shm", "xfixes", "shape", "xinput", "xtest", "render", "composite"] }

[profile.dev]
debug = 0
opt-level = 2

[profile.dev.package."*"]
opt-level = 2


[patch.crates-io]
# xattr 0.2.3 (pulled by gpui via zed-async-tar) reads libc::ENOATTR, which libc 0.2.189+ no longer
# exposes on Linux gnu; there ENOATTR is ENODATA. Same code otherwise.
xattr = { path = "vendor/xattr" }
